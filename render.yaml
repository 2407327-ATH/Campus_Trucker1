services:
  - type: web
    name: campustrack-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campustrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"

databases:
  - name: campustrack-db
    plan: free
    databaseName: campustrack
    user: campustrack
